# Pile de production sur un VPS : application, PostgreSQL, HTTPS, sauvegarde.
#
#   cp deploiement/env.production.exemple .env.production   # puis compléter
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Voir DEPLOIEMENT.md pour la marche complète, la restauration et la mise à jour.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maria
      POSTGRES_DB: maria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      # Tri des accents du français, via ICU (présent dans l'image Alpine).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR"
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql, plus /data.
      - pgdata:/var/lib/postgresql
    # Aucun port publié : la base n'est joignable que depuis la pile.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maria -d maria"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: maria:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://maria:${POSTGRES_PASSWORD}@postgres:5432/maria
      MIGRATIONS_AU_DEMARRAGE: "1"
      STOCKAGE_LOCAL: /donnees/fichiers
    volumes:
      - fichiers:/donnees/fichiers

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE:?DOMAINE est requis (ex. app.exemple.ci)}
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  sauvegarde:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: maria
      PGDATABASE: maria
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SAUVEGARDE_INTERVALLE_HEURES: ${SAUVEGARDE_INTERVALLE_HEURES:-24}
      SAUVEGARDE_JOURS: ${SAUVEGARDE_JOURS:-14}
    entrypoint: ["sh", "/scripts/sauvegarde.sh"]
    volumes:
      - ./deploiement/sauvegarde.sh:/scripts/sauvegarde.sh:ro
      - ./sauvegardes:/sauvegardes
      - fichiers:/donnees/fichiers:ro

volumes:
  pgdata:
  fichiers:
  caddy_data:
  caddy_config:
