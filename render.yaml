# Déploiement Render — https://render.com/docs/blueprint-spec
#
# Render plutôt que Cloudflare ou un runtime Edge : Maria Suite dépend de
# @node-rs/argon2, un binaire natif qui exige un vrai runtime Node. Un isolate
# V8 ne peut pas l'exécuter.
services:
  - type: web
    name: maria-suite
    runtime: node
    # La région doit être celle de la base : un aller-retour transatlantique
    # à chaque requête se sent sur une caisse.
    region: frankfurt
    # Le plan gratuit éteint le service après quinze minutes sans requête, et
    # la requête suivante attend le redémarrage — près d'une minute. Sur une
    # caisse, cette minute est un client qui part et une file qui s'allonge.
    # Sept dollars par mois valent moins cher que la première matinée perdue.
    plan: starter
    branch: main

    # Corepack active pnpm à la version fixée dans package.json. Sans lui,
    # Render tenterait npm et ignorerait le lockfile.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Chaîne de connexion PostgreSQL. Le pool applicatif s'adapte seul :
      # Render fait tourner un process durable, donc plusieurs connexions,
      # contrairement à une fonction sans serveur.
      - key: DATABASE_URL
        sync: false

      - key: AUTH_SECRET
        sync: false

      - key: DEFAULT_COUNTRY
        value: CI

      # Bandeau « données fictives » sur toutes les pages. L'entreprise et son
      # administrateur se créent avec `pnpm installer` ; le mot de passe
      # provisoire n'est connu que de celui qui l'a lancé.
      - key: INSTANCE_DEMO
        value: "1"

      # Modules ouverts malgré des écrans sur jeu d'essai. Clés du registre
      # séparées par des virgules, ou « * » pour toutes.
      #
      # « * » va de pair avec INSTANCE_DEMO=1 : montrer le périmètre à venir
      # est l'objet même d'une instance de présentation. Sur une instance qui
      # porte de vraies recettes, cette valeur doit être VIDE — sans quoi le
      # tableau de bord annonce des factures impayées qui n'existent pas.
      - key: MODULES_APERCU
        value: "*"
